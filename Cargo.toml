[workspace]
resolver = "3"
members = [
  "apps/api",
  "apps/database-worker",
  "apps/sync-worker",
  "crates/*",
]

[workspace.package]
version = "0.3.7"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Forever-Frameworks-LLC/ffdb"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
hex = "0.4.3"
ipnet = "2.12"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keep libsqlite3-sys aligned with SQLx 0.8's optional SQLite support. FFDB uses
# rusqlite directly for project databases; SQLx remains PostgreSQL-only at runtime.
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions", "hooks", "limits", "modern_sqlite"] }
schemars = { version = "1.0", features = ["uuid1"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { package = "ffdb-postgres", path = "crates/postgres" }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
