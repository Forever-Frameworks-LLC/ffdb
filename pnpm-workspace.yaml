packages:
  - "apps/portal"
  - "apps/landing"
  - "apps/docs"
  - "examples/field-notes"
  - "examples/field-notes-native"
  - "packages/*"

overrides:
  "nanoid@<3.3.17": "3.3.17"

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/metro-runtime@57.0.9'
  - '@expo/prebuild-config@57.0.11'
  - '@expo/ui@57.0.10'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-router@57.0.12
  - expo-server@57.0.2
  - expo-splash-screen@57.0.6
  - expo@57.0.12
