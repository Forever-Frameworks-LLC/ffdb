[package]
name = "ffdb-migration-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Atomic FFDB SQLite migrations with explicit down SQL and RLS compilation"

[dependencies]
ffdb-sql-parser = { path = "../sql-parser" }
ffdb-sqlite-rls = { path = "../sqlite-rls" }
ffdb-sqlite-runtime = { path = "../sqlite-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
