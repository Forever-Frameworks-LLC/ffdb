[package]
name = "ffdb-sqlite-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Hardened, context-bound SQLite execution for FFDB workers"

[dependencies]
base64 = "0.22.1"
ffdb-sql-parser = { path = "../sql-parser" }
ffdb-sqlite-rls = { path = "../sqlite-rls" }
hex.workspace = true
hmac = "0.13.0"
rusqlite = { workspace = true, features = ["column_decltype"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tracing.workspace = true
uuid = { version = "1.17", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
