[package]
name = "ffdb-rate-limits"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
hmac = "0.12"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx.workspace = true
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }
