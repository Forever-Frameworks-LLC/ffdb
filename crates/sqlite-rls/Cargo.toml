[package]
name = "ffdb-sqlite-rls"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "FFDB PostgreSQL-style RLS metadata and SQLite compiler"

[dependencies]
ffdb-sql-parser = { path = "../sql-parser" }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1.9.0"
rusqlite = { workspace = true }

[lints]
workspace = true
