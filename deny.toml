[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates intentionally use local path dependencies without publishing
# version requirements. Keep wildcard registry and git dependencies denied while
# permitting only those local path edges.
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
