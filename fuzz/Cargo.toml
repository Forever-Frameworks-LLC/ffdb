[package]
name = "ffdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
ffdb-sql-parser = { path = "../crates/sql-parser" }
ffdb-sqlite-rls = { path = "../crates/sqlite-rls" }
ffdb-sqlite-runtime = { path = "../crates/sqlite-runtime" }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "sql_parser"
path = "fuzz_targets/sql_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rls_bypass"
path = "fuzz_targets/rls_bypass.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
