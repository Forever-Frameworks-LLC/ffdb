name: ffdb-single-host

# Explicit all-in-one evaluation profile. It is not the recommended
# internet-production topology: PostgreSQL, MinIO, and Mailpit share this host.
# Every image reference is supplied by signed release metadata and pinned by an
# immutable manifest-list digest.
services:
  postgres:
    image: ${FFDB_POSTGRES_IMAGE:?release bundle is missing FFDB_POSTGRES_IMAGE}
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: ffdb
      POSTGRES_USER: ffdb
      POSTGRES_PASSWORD: ${FFDB_SINGLE_HOST_POSTGRES_PASSWORD:?single-host secrets are missing}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffdb -d ffdb"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: ${FFDB_MINIO_IMAGE:?release bundle is missing FFDB_MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FFDB_SINGLE_HOST_MINIO_ACCESS_KEY:?single-host secrets are missing}
      MINIO_ROOT_PASSWORD: ${FFDB_SINGLE_HOST_MINIO_SECRET_KEY:?single-host secrets are missing}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FFDB_CORS_ALLOWED_ORIGINS:?single-host origins are missing}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${FFDB_SINGLE_HOST_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${FFDB_SINGLE_HOST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-bootstrap:
    image: ${FFDB_MINIO_IMAGE:?release bundle is missing FFDB_MINIO_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MINIO_ROOT_USER: ${FFDB_SINGLE_HOST_MINIO_ACCESS_KEY:?single-host secrets are missing}
      MINIO_ROOT_PASSWORD: ${FFDB_SINGLE_HOST_MINIO_SECRET_KEY:?single-host secrets are missing}
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/ffdb &&
        mc anonymous set none local/ffdb
    restart: "no"

  mailpit:
    image: ${FFDB_MAILPIT_IMAGE:?release bundle is missing FFDB_MAILPIT_IMAGE}
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${FFDB_SINGLE_HOST_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${FFDB_SINGLE_HOST_MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

  volume-init:
    image: ${FFDB_RUNTIME_IMAGE:?release bundle is missing FFDB_RUNTIME_IMAGE}
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - chown -R 10001:10001 /var/lib/ffdb/projects /var/lib/ffdb/backups /var/lib/ffdb/metrics /var/lib/ffdb/sync
    read_only: true
    volumes:
      - project-data:/var/lib/ffdb/projects
      - backup-data:/var/lib/ffdb/backups
      - metrics-data:/var/lib/ffdb/metrics
      - sync-data:/var/lib/ffdb/sync
    restart: "no"

  api:
    image: ${FFDB_RUNTIME_IMAGE:?release bundle is missing FFDB_RUNTIME_IMAGE}
    environment:
      # SMTP and local HTTP object storage are accepted only in this explicitly
      # selected evaluation profile. The external profile remains production.
      FFDB_ENVIRONMENT: development
      FFDB_HTTP_BIND: 0.0.0.0:8080
      FFDB_PUBLIC_BASE_URL: ${FFDB_PUBLIC_BASE_URL:?single-host public URL is missing}
      FFDB_CORS_ALLOWED_ORIGINS: ${FFDB_CORS_ALLOWED_ORIGINS:?single-host origins are missing}
      FFDB_TRUSTED_PROXY_CIDRS: ${FFDB_TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      FFDB_DATABASE_URL: ${FFDB_DATABASE_URL:?single-host PostgreSQL URL is missing}
      FFDB_POSTGRES_MIN_CONNECTIONS: ${FFDB_POSTGRES_MIN_CONNECTIONS:-2}
      FFDB_POSTGRES_MAX_CONNECTIONS: ${FFDB_POSTGRES_MAX_CONNECTIONS:-20}
      FFDB_POSTGRES_ACQUIRE_TIMEOUT_MS: ${FFDB_POSTGRES_ACQUIRE_TIMEOUT_MS:-5000}
      FFDB_POSTGRES_IDLE_TIMEOUT_SECONDS: ${FFDB_POSTGRES_IDLE_TIMEOUT_SECONDS:-600}
      FFDB_POSTGRES_MAX_LIFETIME_SECONDS: ${FFDB_POSTGRES_MAX_LIFETIME_SECONDS:-1800}
      FFDB_RATE_LIMIT_PRE_AUTH_CAPACITY: ${FFDB_RATE_LIMIT_PRE_AUTH_CAPACITY:-120}
      FFDB_RATE_LIMIT_PRE_AUTH_REFILL_PER_SECOND: ${FFDB_RATE_LIMIT_PRE_AUTH_REFILL_PER_SECOND:-2}
      FFDB_RATE_LIMIT_EXECUTION_CAPACITY: ${FFDB_RATE_LIMIT_EXECUTION_CAPACITY:-2000}
      FFDB_RATE_LIMIT_EXECUTION_REFILL_PER_SECOND: ${FFDB_RATE_LIMIT_EXECUTION_REFILL_PER_SECOND:-200}
      FFDB_RATE_LIMIT_IDLE_TTL_SECONDS: ${FFDB_RATE_LIMIT_IDLE_TTL_SECONDS:-3600}
      FFDB_RATE_LIMIT_MAX_ENTRIES: ${FFDB_RATE_LIMIT_MAX_ENTRIES:-1000000}
      FFDB_NODE_ID: ${FFDB_NODE_ID:?single-host node ID is missing}
      FFDB_NODE_NAME: ${FFDB_NODE_NAME:-ffdb-single-host-01}
      FFDB_DATABASE_ROOT: /var/lib/ffdb/projects
      FFDB_BACKUP_ROOT: /var/lib/ffdb/backups
      FFDB_METRICS_ROOT: /var/lib/ffdb/metrics
      FFDB_DATABASE_WORKER: /usr/local/bin/ffdb-database-worker
      FFDB_WORKER_MAX_PROCESSES: ${FFDB_WORKER_MAX_PROCESSES:-4}
      FFDB_WORKER_QUEUE_CAPACITY: ${FFDB_WORKER_QUEUE_CAPACITY:-16}
      FFDB_MASTER_KEY: ${FFDB_MASTER_KEY:?single-host master key is missing}
      FFDB_BACKUP_MASTER_KEY: ${FFDB_BACKUP_MASTER_KEY:?single-host backup key is missing}
      FFDB_CURSOR_HMAC_KEY: ${FFDB_CURSOR_HMAC_KEY:?single-host cursor key is missing}
      FFDB_BOOTSTRAP_TOKEN: ${FFDB_BOOTSTRAP_TOKEN:?single-host bootstrap token is missing}
      FFDB_S3_ENDPOINT: http://minio:9000
      FFDB_S3_PUBLIC_ENDPOINT: ${FFDB_S3_PUBLIC_ENDPOINT:?single-host S3 URL is missing}
      FFDB_S3_REGION: us-east-1
      FFDB_S3_BUCKET: ffdb
      FFDB_S3_ACCESS_KEY_ID: ${FFDB_SINGLE_HOST_MINIO_ACCESS_KEY:?single-host secrets are missing}
      FFDB_S3_SECRET_ACCESS_KEY: ${FFDB_SINGLE_HOST_MINIO_SECRET_KEY:?single-host secrets are missing}
      FFDB_EMAIL_TRANSPORT: smtp
      FFDB_SMTP_HOST: mailpit
      FFDB_SMTP_PORT: "1025"
      FFDB_EMAIL_FROM: FFDB <noreply@localhost.test>
      FFDB_STRIPE_SECRET_KEY: ${FFDB_STRIPE_SECRET_KEY:-}
      FFDB_STRIPE_WEBHOOK_SECRET: ${FFDB_STRIPE_WEBHOOK_SECRET:-}
      FFDB_STRIPE_PRO_BASE_PRICE_ID: ${FFDB_STRIPE_PRO_BASE_PRICE_ID:-}
      FFDB_STRIPE_READS_EVENT_NAME: ${FFDB_STRIPE_READS_EVENT_NAME:-}
      FFDB_STRIPE_READS_METER_ID: ${FFDB_STRIPE_READS_METER_ID:-}
      FFDB_STRIPE_PAYG_READS_PRICE_ID: ${FFDB_STRIPE_PAYG_READS_PRICE_ID:-}
      FFDB_STRIPE_PRO_READS_PRICE_ID: ${FFDB_STRIPE_PRO_READS_PRICE_ID:-}
      FFDB_STRIPE_WRITES_EVENT_NAME: ${FFDB_STRIPE_WRITES_EVENT_NAME:-}
      FFDB_STRIPE_WRITES_METER_ID: ${FFDB_STRIPE_WRITES_METER_ID:-}
      FFDB_STRIPE_PAYG_WRITES_PRICE_ID: ${FFDB_STRIPE_PAYG_WRITES_PRICE_ID:-}
      FFDB_STRIPE_PRO_WRITES_PRICE_ID: ${FFDB_STRIPE_PRO_WRITES_PRICE_ID:-}
      FFDB_STRIPE_STORAGE_EVENT_NAME: ${FFDB_STRIPE_STORAGE_EVENT_NAME:-}
      FFDB_STRIPE_STORAGE_METER_ID: ${FFDB_STRIPE_STORAGE_METER_ID:-}
      FFDB_STRIPE_PAYG_STORAGE_PRICE_ID: ${FFDB_STRIPE_PAYG_STORAGE_PRICE_ID:-}
      FFDB_STRIPE_PRO_STORAGE_PRICE_ID: ${FFDB_STRIPE_PRO_STORAGE_PRICE_ID:-}
      FFDB_STRIPE_MAU_EVENT_NAME: ${FFDB_STRIPE_MAU_EVENT_NAME:-}
      FFDB_STRIPE_MAU_METER_ID: ${FFDB_STRIPE_MAU_METER_ID:-}
      FFDB_STRIPE_PAYG_MAU_PRICE_ID: ${FFDB_STRIPE_PAYG_MAU_PRICE_ID:-}
      FFDB_STRIPE_PRO_MAU_PRICE_ID: ${FFDB_STRIPE_PRO_MAU_PRICE_ID:-}
      FFDB_STRIPE_PRO_BILLING_UNIT: ${FFDB_STRIPE_PRO_BILLING_UNIT:-organization}
      FFDB_BILLING_SUCCESS_URL: ${FFDB_BILLING_SUCCESS_URL:-}
      FFDB_BILLING_CANCEL_URL: ${FFDB_BILLING_CANCEL_URL:-}
      FFDB_BILLING_PORTAL_RETURN_URL: ${FFDB_BILLING_PORTAL_RETURN_URL:-}
      FFDB_INSTANCE_STRIPE_CONNECT_SECRET_KEY: ${FFDB_INSTANCE_STRIPE_CONNECT_SECRET_KEY:-}
      FFDB_INSTANCE_STRIPE_CONNECT_WEBHOOK_SECRET: ${FFDB_INSTANCE_STRIPE_CONNECT_WEBHOOK_SECRET:-}
      FFDB_COMMERCE_STRIPE_CONNECT_SECRET_KEY: ${FFDB_COMMERCE_STRIPE_CONNECT_SECRET_KEY:-}
      FFDB_COMMERCE_STRIPE_CONNECT_WEBHOOK_SECRET: ${FFDB_COMMERCE_STRIPE_CONNECT_WEBHOOK_SECRET:-}
      RUST_LOG: ${FFDB_RUST_LOG:-ffdb=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    expose: ["8080"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - project-data:/var/lib/ffdb/projects
      - backup-data:/var/lib/ffdb/backups
      - metrics-data:/var/lib/ffdb/metrics
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: ${FFDB_API_CPUS:-2.0}
    mem_limit: ${FFDB_API_MEMORY_LIMIT:-2g}
    pids_limit: ${FFDB_API_PIDS_LIMIT:-512}
    stop_grace_period: 30s
    restart: unless-stopped

  sync-worker:
    image: ${FFDB_RUNTIME_IMAGE:?release bundle is missing FFDB_RUNTIME_IMAGE}
    command: ["/usr/local/bin/ffdb-sync-worker"]
    environment:
      FFDB_SYNC_STATE_DIR: /var/lib/ffdb/sync
      FFDB_SYNC_MAINTENANCE_INTERVAL_SECONDS: ${FFDB_SYNC_MAINTENANCE_INTERVAL_SECONDS:-60}
      FFDB_SYNC_STALE_TEMPORARY_SECONDS: ${FFDB_SYNC_STALE_TEMPORARY_SECONDS:-3600}
      RUST_LOG: ${FFDB_RUST_LOG:-ffdb=info}
    depends_on:
      api:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - sync-data:/var/lib/ffdb/sync
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: ${FFDB_SYNC_CPUS:-0.5}
    mem_limit: ${FFDB_SYNC_MEMORY_LIMIT:-256m}
    pids_limit: ${FFDB_SYNC_PIDS_LIMIT:-64}
    stop_grace_period: 30s
    restart: unless-stopped

  gateway:
    image: ${FFDB_GATEWAY_IMAGE:?release bundle is missing FFDB_GATEWAY_IMAGE}
    environment:
      FFDB_S3_PUBLIC_ORIGIN: ${FFDB_S3_PUBLIC_ORIGIN:?single-host S3 origin is missing}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FFDB_GATEWAY_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: ${FFDB_GATEWAY_CPUS:-0.5}
    mem_limit: ${FFDB_GATEWAY_MEMORY_LIMIT:-256m}
    pids_limit: ${FFDB_GATEWAY_PIDS_LIMIT:-64}
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  project-data:
  backup-data:
  metrics-data:
  sync-data:
