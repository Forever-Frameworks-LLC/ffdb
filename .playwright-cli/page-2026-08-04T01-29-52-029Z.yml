            - generic [ref=f34e131]: FFDB
          - paragraph [ref=f34e132]: For an evaluation or isolated host, download the stable installer from the canonical GitHub Releases channel. It resolves the latest stable tag, verifies its signed assets, and starts PostgreSQL, object storage, captured email, FFDB, and a compiled nginx gateway. Port 5173 is that gateway—not a Vite development server. It serves the production landing, docs, and portal files and proxies API routes to the private Axum service on port 8080. It generates root-only secrets and preserves durable volumes. Pin an exact tag for reproducible production installs and use the external-provider profile before serving internet traffic.
          - code [ref=f34e134]: "curl -fsSLo ffdb-install.sh \\ https://github.com/Forever-Frameworks-LLC/ffdb/releases/latest/download/install.sh less ffdb-install.sh sudo sh ffdb-install.sh --profile single-host \\ --start --require-signature sudo ffdb-host status # Compiled nginx gateway readiness; no Vite server runs here. curl --fail http://127.0.0.1:5173/readyz"
