      - paragraph [ref=f34e601]: No free organization is charged automatically. The owner chooses Stripe BYO or Connect during instance setup, FFDB provisions the plan catalog, and verified webhooks—not browser redirects—change plan entitlements. The two-project Free cap and automated read, write, logical-storage, storage byte-hour, and MAU metering are enforced through the durable reporting and reconciliation pipeline.
