          - emphasis [ref=f34e540]: Charge for what grows.
        - paragraph [ref=f34e541]: "FFDB keeps the organization plan that pays for FFDB separate from commerce inside a customer project. Platform usage billing and project commerce are both implemented: each project can use encrypted BYO Stripe credentials or optional Connect direct charges for products, immutable prices, one-time purchases, memberships, refunds, entitlements, and paid-order fulfillment."
