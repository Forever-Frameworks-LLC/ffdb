            - code [ref=f33e261]: sudo env \ FFDB_VERSION=0.3.0 \ FFDB_RELEASE_BASE_URL=file:///srv/ffdb/releases/v0.3.0 \ sh ./install.sh --profile single-host --start --require-signature sudo ffdb-host status
        - complementary [ref=f33e262]:
          - text: i
          - strong [ref=f33e263]: Release discovery is separate from installation
          - paragraph [ref=f33e264]: The examples pin the supported 0.3.0 release while the latest URL tracks the stable channel. The installer verifies the signed checksum list, bundle, controller, and pinned images. Mirrors must preserve the release filenames and Sigstore bundle unchanged.
      - generic [ref=f33e265]:
        - heading [level=2] [ref=f33e266]:
          - link "Understand the single-host boundary" [ref=f33e267] [cursor=pointer]:
            - /url: "#understand-the-single-host-boundary"
            - text: Understand the single-host boundary#
        - paragraph [ref=f33e268]: The selected release pins PostgreSQL, MinIO, Mailpit, the FFDB runtime, and the gateway by immutable image digest. The installer generates independent strong PostgreSQL, MinIO, encryption, HMAC, bootstrap, and node credentials, writes them to /etc/ffdb/single-host.env at mode 0600, preserves existing secrets on reinstall or upgrade, and never prints them.
        - list [ref=f33e269]:
          - listitem [ref=f33e270]: The compiled nginx gateway listens at http://127.0.0.1:5173; this is not a Vite development server.
          - listitem [ref=f33e271]: The gateway serves the landing site at /, docs at /docs/, and the portal at /app/, then proxies /v1, /healthz, /readyz, /metrics, and /openapi.json to the private Axum service at api:8080.
          - listitem [ref=f33e272]: The packaged Docker profiles expose Axum port 8080 only to the Compose network, never directly to the host.
          - listitem [ref=f33e273]: MinIO API and console listen at loopback ports 9000 and 9001.
          - listitem [ref=f33e274]: Mailpit SMTP and captured-mail UI listen at loopback ports 1025 and 8025.
          - listitem [ref=f33e275]: PostgreSQL has no host port; all exposed host ports are loopback-only.
          - listitem [ref=f33e276]: The seven named volumes preserve PostgreSQL, object data, captured mail, project SQLite files, encrypted backups, organization usage/billing ledgers, and sync state across normal stop, upgrade, rollback, and uninstall.
      - generic [ref=f33e277]:
