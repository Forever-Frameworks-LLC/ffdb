        - heading "Install with Docker Compose" [level=1] [ref=f33e118]
        - paragraph [ref=f33e119]: Copy a complete Docker Compose stack, start FFDB, and finish first-run setup in the portal.
      - generic [ref=f33e120]:
        - heading [level=2] [ref=f33e121]:
          - link "What, why, and when" [ref=f33e122] [cursor=pointer]:
            - /url: "#what-why-and-when"
            - text: What, why, and when#
        - paragraph [ref=f33e123]: This guide starts a complete FFDB single-host evaluation directly from a copyable Docker Compose file and a protected environment file.
        - paragraph [ref=f33e124]: It gives Docker users the actual service definition, required values, health checks, volumes, and lifecycle commands instead of making a local source tree or installer script the only visible path.
        - paragraph [ref=f33e125]: Use the direct Compose path for local evaluation or a trusted private network. Use the signed external-provider release profile before admitting internet traffic or production data.
      - generic [ref=f33e126]:
        - heading [level=2] [ref=f33e127]:
          - link "Prerequisites and required values" [ref=f33e128] [cursor=pointer]:
            - /url: "#prerequisites-and-required-values"
            - text: Prerequisites and required values#
        - list [ref=f33e129]:
          - listitem [ref=f33e130]: Prerequisite — Docker Engine 27 or newer with Compose v2, OpenSSL, sufficient host resources, and the documented loopback ports.
          - listitem [ref=f33e131]: "Prerequisite — For later production: operator-managed PostgreSQL, S3-compatible storage, email delivery, DNS, TLS, and off-host backups."
          - listitem [ref=f33e132]: Required value — Independent PostgreSQL, MinIO, encryption, backup, HMAC, and bootstrap secrets plus a unique node UUID.
          - listitem [ref=f33e133]: Required value — The exact local public origin, database URL, object-storage origins, and release-matched FFDB image version.
      - generic [ref=f33e134]:
        - heading [level=2] [ref=f33e135]:
          - link "Before you start" [ref=f33e136] [cursor=pointer]:
            - /url: "#before-you-start"
            - text: Before you start#
        - paragraph [ref=f33e137]: This page is the direct Docker path. Copy compose.yaml and .env into an empty directory, generate the required infrastructure secrets, and run docker compose up. You do not clone the FFDB repository, install Rust or Node.js, or execute a source build.
        - paragraph [ref=f33e138]: The example is a complete single-host installation for local evaluation and private networks. It includes PostgreSQL, MinIO, Mailpit, the FFDB API and workers, and the compiled web gateway. The first browser user still completes owner and instance onboarding; no Stripe account or billing mode is selected in advance.
        - list [ref=f33e139]:
          - listitem [ref=f33e140]: Docker Engine 27 or newer with Docker Compose v2.
          - listitem [ref=f33e141]: At least 4 CPU cores, 8 GB of memory, and 20 GB of free disk for a useful evaluation.
          - listitem [ref=f33e142]: OpenSSL for generating independent secrets and a browser on the same trusted machine.
          - listitem [ref=f33e143]: Loopback ports 5173, 9000, 9001, 8025, and 1025 available.
        - complementary [ref=f33e144]:
          - text: i
          - strong [ref=f33e145]: Why Compose instead of one docker run command
          - paragraph [ref=f33e146]: FFDB has independent database, object-storage, mail, API, maintenance-worker, and gateway processes with ordered health checks and seven durable volumes. Docker Compose expresses that complete topology. A single docker run command would omit required services or hide their lifecycle inside one unsafe container.
      - generic [ref=f33e147]:
        - heading [level=2] [ref=f33e148]:
          - link "1. Copy compose.yaml" [ref=f33e149] [cursor=pointer]:
            - /url: "#1-copy-compose-yaml"
            - text: 1. Copy compose.yaml#
        - paragraph [ref=f33e150]: Create an empty directory named ffdb, save this complete file as compose.yaml, and keep its seven named volumes. Both FFDB images are pinned to the server release version; use the same version for every FFDB image during an upgrade.
