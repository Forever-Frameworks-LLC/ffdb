            - status [ref=f33e208]
          - generic "Terminal, sh code" [ref=f33e209]:
            - code [ref=f33e210]: docker compose config --quiet docker compose pull docker compose up --detach --wait docker compose ps curl --fail http://127.0.0.1:5173/healthz curl --fail http://127.0.0.1:5173/readyz curl --fail http://127.0.0.1:5173/openapi.json >/dev/null
        - complementary [ref=f33e211]:
          - text: i
          - strong [ref=f33e212]: What is listening
          - paragraph [ref=f33e213]: Open http://127.0.0.1:5173/ for the product site, /docs/ for these docs, and /app/ for the portal. MinIO's local console is on 9001 and captured evaluation email is on 8025. PostgreSQL and Axum remain internal to the Compose network.
      - generic [ref=f33e214]:
        - heading [level=2] [ref=f33e215]:
          - link "4. Create the first owner and choose the instance type" [ref=f33e216] [cursor=pointer]:
            - /url: "#4-create-the-first-owner-and-choose-the-instance-type"
            - text: 4. Create the first owner and choose the instance type#
        - paragraph [ref=f33e217]: Open http://127.0.0.1:5173/app/. Paste FFDB_BOOTSTRAP_TOKEN from the protected .env file, create the first owner, and choose private, team, platform billing with your Stripe keys, or Stripe Connect. The wizard collects provider values when the selected mode needs them; no Stripe variables are required in compose.yaml.
        - paragraph [ref=f33e218]: Onboarding must finish before the owner can create organizations or projects. After it completes, create the first organization and project directly in the portal and verify that the project appears in the project switcher.
        - complementary [ref=f33e219]:
          - text: i
          - strong [ref=f33e220]: Use the trusted local origin
          - paragraph [ref=f33e221]: Paste the bootstrap token only into the portal served by this installation. Do not put it in application code, a browser bundle, screenshots, shell history, or support logs.
      - generic [ref=f33e222]:
