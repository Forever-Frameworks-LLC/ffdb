E - FFDB_DATABASE_ROOT - FFDB_BACKUP_ROOT - FFDB_METRICS_ROOT - FFDB_DATABASE_WORKER - FFDB_MASTER_KEY - FFDB_BACKUP_MASTER_KEY - FFDB_CURSOR_HMAC_KEY - FFDB_BOOTSTRAP_TOKEN - FFDB_S3_ENDPOINT - FFDB_S3_PUBLIC_ENDPOINT - FFDB_S3_REGION - FFDB_S3_BUCKET - FFDB_S3_ACCESS_KEY_ID - FFDB_S3_SECRET_ACCESS_KEY - FFDB_EMAIL_TRANSPORT - FFDB_SMTP_HOST - FFDB_SMTP_PORT - FFDB_EMAIL_FROM - RUST_LOG depends_on: postgres: condition: service_healthy minio-bootstrap: condition: service_completed_successfully mailpit: condition: service_healthy volume-init: condition: service_completed_successfully healthcheck: test: [\"CMD\", \"curl\", \"--fail\", \"--silent\", \"http://127.0.0.1:8080/readyz\"] interval: 5s timeout: 3s retries: 30 start_period: 5s expose: [\"8080\"] read_only: true tmpfs: - /tmp:rw,noexec,nosuid,nodev,size=64m volumes: - project-data:/var/lib/ffdb/projects - backup-data:/var/lib/ffdb/backups - metrics-data:/var/lib/ffdb/metrics cap_drop: [\"ALL\"] security_opt: [\"no-new-privileges:true\"] restart: unless-stopped sync-worker: image: ghcr.io/forever-frameworks-llc/ffdb-runtime:0.3.0 command: [\"/usr/local/bin/ffdb-sync-worker\"] environment: - FFDB_SYNC_STATE_DIR - FFDB_SYNC_MAINTENANCE_INTERVAL_SECONDS - FFDB_SYNC_STALE_TEMPORARY_SECONDS - RUST_LOG depends_on: api: condition: service_healthy volume-init: condition: service_completed_successfully read_only: true tmpfs: - /tmp:rw,noexec,nosuid,nodev,size=16m volumes: - sync-data:/var/lib/ffdb/sync cap_drop: [\"ALL\"] security_opt: [\"no-new-privileges:true\"] restart: unless-stopped gateway: image: ghcr.io/forever-frameworks-llc/ffdb-gateway:0.3.0 environment: - FFDB_S3_PUBLIC_ORIGIN depends_on: api: condition: service_healthy ports: - \"127.0.0.1:5173:8080\" read_only: true tmpfs: - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 cap_drop: [\"ALL\"] security_opt: [\"no-new-privileges:true\"] restart: unless-stopped volumes: postgres-data: minio-data: mailpit-data: project-data: backup-data: metrics-data: sync-data:"
      - generic [ref=f33e163]:
        - heading [level=2] [ref=f33e164]:
          - link "2. Create .env and replace every placeholder" [ref=f33e165] [cursor=pointer]:
            - /url: "#2-create-env-and-replace-every-placeholder"
            - text: 2. Create .env and replace every placeholder#
        - paragraph [ref=f33e166]: Save the template as .env beside compose.yaml, set its mode to 0600, and replace every replace-with value. PostgreSQL, MinIO, the database encryption key, backup key, cursor HMAC key, and bootstrap token must all be independent.
        - paragraph [ref=f33e167]: Use openssl rand -hex 24 for the PostgreSQL and MinIO passwords, openssl rand -base64 32 for each encryption key, and openssl rand -hex 32 for the HMAC key and bootstrap token. Copy the PostgreSQL password into FFDB_DATABASE_URL and the MinIO password into FFDB_S3_SECRET_ACCESS_KEY. Generate a unique UUID for FFDB_NODE_ID.
        - figure ".env env Copy .env code" [ref=f33e168]:
