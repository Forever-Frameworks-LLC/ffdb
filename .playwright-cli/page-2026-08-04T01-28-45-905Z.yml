        - list [ref=f33e383]:
          - listitem [ref=f33e384]: 1. Save the complete compose.yaml and .env examples in an empty directory.
          - listitem [ref=f33e385]: 2. Generate every secret independently, copy matching provider passwords into their FFDB values, and restrict .env to the operator.
          - listitem [ref=f33e386]: 3. Run docker compose config, pull, and docker compose up --detach --wait.
          - listitem [ref=f33e387]: 4. Verify health, readiness, OpenAPI, and service status through the compiled loopback gateway.
          - listitem [ref=f33e388]: 5. Open /app/, create the first owner, choose the instance type, finish onboarding, and create the first organization and project.
