            - text: Retrieve the generated bootstrap token safely#
        - paragraph [ref=f33e280]: The bootstrap token remains only in the root-readable single-host environment. Extract it to a root-owned file for secret-manager ingestion without writing the value to the terminal; ffdb-host status and logs do not reveal it.
