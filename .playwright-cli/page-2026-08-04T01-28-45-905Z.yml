          - link "Optional signed lifecycle controller" [ref=f33e224] [cursor=pointer]:
            - /url: "#optional-signed-lifecycle-controller"
            - text: Optional signed lifecycle controller#
        - paragraph [ref=f33e225]: The direct Compose path above is complete. Operators who also want signature verification, immutable digest resolution, installed release directories, backup/update/rollback commands, and root-owned generated configuration can use the release controller instead. It manages the same Docker topology; it is not required for the copyable Compose path.
