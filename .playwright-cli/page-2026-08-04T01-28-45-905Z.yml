            - text: Operate and troubleshoot#
        - paragraph [ref=f33e324]: For the direct path, start with docker compose ps and the bounded service logs above. A failed PostgreSQL login usually means POSTGRES_PASSWORD and the password inside FFDB_DATABASE_URL differ. A failed MinIO bootstrap usually means MINIO_ROOT_PASSWORD and FFDB_S3_SECRET_ACCESS_KEY differ. An instance.setup_required response means the owner must finish the portal wizard before creating organizations or projects. For production, also inspect response security headers, directly reload a nested /docs/ route, and verify an authorized browser upload against the configured S3 CORS and gateway CSP.
