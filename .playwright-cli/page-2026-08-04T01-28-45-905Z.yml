        - complementary [ref=f33e192]:
          - text: i
          - strong [ref=f33e193]: Do not reuse or commit .env
          - paragraph [ref=f33e194]: The bootstrap token creates the first owner; the master keys protect stored credentials and backups. Keep .env outside version control, restrict it to the host operator, and back up the encryption keys separately from the data volumes.
      - generic [ref=f33e195]:
        - heading [level=2] [ref=f33e196]:
          - link "3. Start and verify the stack" [ref=f33e197] [cursor=pointer]:
            - /url: "#3-start-and-verify-the-stack"
            - text: 3. Start and verify the stack#
        - paragraph [ref=f33e198]: Compose pulls the released images, starts dependencies in order, and waits for their health checks. The public entry point is the gateway on 127.0.0.1:5173. It serves compiled assets and proxies API traffic to private Axum port 8080; it is not a Vite development server.
