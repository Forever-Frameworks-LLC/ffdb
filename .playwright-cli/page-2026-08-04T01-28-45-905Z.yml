            - text: Upgrade, roll back, and retain data#
        - paragraph [ref=f33e364]: ffdb-host update-check compares the active release with the latest stable GitHub Release without changing the host. Read the intervening release notes, complete the topology-appropriate coordinated backup, then run update. No arguments selects latest stable; --version pins an exact target for scheduled production rollouts. The controller installs beside the current release and preserves configuration and named volumes.
        - figure "Check and update sh Copy Check and update code" [ref=f33e365]:
          - generic [ref=f33e366]:
            - generic [ref=f33e367]: Check and update
            - generic [ref=f33e368]: sh
            - button "Copy Check and update code" [ref=f33e369] [cursor=pointer]:
              - generic [ref=f33e373]: Copy
            - status [ref=f33e374]
          - generic "Check and update, sh code" [ref=f33e375]:
            - code [ref=f33e376]: "sudo ffdb-host version sudo ffdb-host update-check # Packaged single-host backup. External providers need their coordinated backup. sudo ffdb-host backup create /secure/ffdb-before-update.tar.gz sudo FFDB_REQUIRE_SIGNATURE=1 ffdb-host update sudo ffdb-host status # Reproducible alternative after reviewing the exact tag: sudo ffdb-host update-check --version 0.3.1 sudo FFDB_REQUIRE_SIGNATURE=1 ffdb-host update --version 0.3.1 # If acceptance fails: sudo ffdb-host rollback 0.3.0 --acknowledge-migration-risk # Normal shutdown preserves durable state: sudo ffdb-host stop"
        - complementary [ref=f33e377]:
          - text: i
          - strong [ref=f33e378]: Volumes are the data
          - paragraph [ref=f33e379]: For the direct path, docker compose down preserves named volumes, while docker compose down --volumes deletes the installation's durable state. For the managed path, ffdb-host uninstall is a separate explicit action. Neither command is an update or rollback workflow; take and restore-test a coordinated backup first.
      - generic [ref=f33e380]:
        - heading [level=2] [ref=f33e381]:
