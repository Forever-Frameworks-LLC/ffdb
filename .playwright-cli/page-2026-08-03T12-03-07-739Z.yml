            - status [ref=f1e104]
          - generic "Terminal, sh code" [ref=f1e105]:
            - code [ref=f1e106]: sudo sh -c 'umask 077; sed -n "s/^FFDB_BOOTSTRAP_TOKEN=//p" \ /etc/ffdb/single-host.env > /root/ffdb-bootstrap-token'
      - generic [ref=f1e107]:
        - heading [level=2] [ref=f1e108]:
          - link "Operate the packaged lifecycle" [ref=f1e109] [cursor=pointer]:
            - /url: "#operate-the-packaged-lifecycle"
            - text: Operate the packaged lifecycle#
        - paragraph [ref=f1e110]: ffdb-host selects the installed signed release and keeps configuration and durable volumes outside its immutable release directory.
