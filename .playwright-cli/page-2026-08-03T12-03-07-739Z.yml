        - complementary [ref=f1e69]:
          - text: "!"
          - strong [ref=f1e70]: Public channel status
          - paragraph [ref=f1e71]: The public install URL and container images are not published yet. The first command is the release-ready interface, not a working download today. Until release notes enable it, validate only a trusted local or directly supplied bundle and its checksum.
      - generic [ref=f1e72]:
        - heading [level=2] [ref=f1e73]:
          - link "Verify the single-host services" [ref=f1e74] [cursor=pointer]:
            - /url: "#verify-the-single-host-services"
            - text: Verify the single-host services#
        - paragraph [ref=f1e75]: The installer generates independent strong credentials with OpenSSL, writes them root-only to /etc/ffdb/single-host.env at mode 0600, and never prints them. Every exposed host port is loopback-only, PostgreSQL has no host port, and six named volumes preserve database, object, captured-mail, project, backup, and sync state across normal stop, upgrade, rollback, and uninstall operations.
        - figure "Terminal sh Copy Terminal code" [ref=f1e76]:
          - generic [ref=f1e77]:
            - generic [ref=f1e78]: Terminal
            - generic [ref=f1e79]: sh
            - button "Copy Terminal code" [ref=f1e80] [cursor=pointer]:
              - generic [ref=f1e84]: Copy
            - status [ref=f1e85]
          - generic "Terminal, sh code" [ref=f1e86]:
            - code [ref=f1e87]: sudo ffdb-host status curl --fail http://127.0.0.1:5173/readyz
        - complementary [ref=f1e88]:
          - text: "!"
          - strong [ref=f1e89]: Evaluation and local use only
          - paragraph [ref=f1e90]: single-host sets FFDB_ENVIRONMENT=development, uses local HTTP MinIO and Mailpit mail capture, and concentrates every durable dependency on one host. Do not expose it to the internet. The external-provider release profile with independently backed-up PostgreSQL, HTTPS object storage, real email delivery, and TLS remains the recommended internet-production topology.
      - generic [ref=f1e91]:
        - heading [level=2] [ref=f1e92]:
          - link "Retrieve the bootstrap token without printing it" [ref=f1e93] [cursor=pointer]:
            - /url: "#retrieve-the-bootstrap-token-without-printing-it"
            - text: Retrieve the bootstrap token without printing it#
        - paragraph [ref=f1e94]: The generated one-time token remains in the root-readable single-host environment file. Copy only that value into a root-owned file for ingestion by a secret manager; ffdb-host status and logs never reveal it.
        - figure "Terminal sh Copy Terminal code" [ref=f1e95]:
          - generic [ref=f1e96]:
            - generic [ref=f1e97]: Terminal
            - generic [ref=f1e98]: sh
            - button "Copy Terminal code" [ref=f1e99] [cursor=pointer]:
