      - generic [ref=f1e123]:
        - heading [level=2] [ref=f1e124]:
          - link "Bootstrap the first owner" [ref=f1e125] [cursor=pointer]:
            - /url: "#bootstrap-the-first-owner"
            - text: Bootstrap the first owner#
        - paragraph [ref=f1e126]: A new installation accepts the generated one-time bootstrap token only until the first platform owner exists. Provision it from the root-only file or secret manager into the trusted operator process, and never print it, copy it into browser code, or use a documented default.
        - figure "Terminal sh Copy Terminal code" [ref=f1e127]:
          - generic [ref=f1e128]:
            - generic [ref=f1e129]: Terminal
            - generic [ref=f1e130]: sh
            - button "Copy Terminal code" [ref=f1e131] [cursor=pointer]:
              - generic [ref=f1e135]: Copy
            - status [ref=f1e136]
          - generic "Terminal, sh code" [ref=f1e137]:
            - code [ref=f1e138]: "export FFDB_OWNER_EMAIL=admin@example.test read -r -s -p \"Owner password: \" FFDB_OWNER_PASSWORD export FFDB_OWNER_PASSWORD read -r -s -p \"Bootstrap token: \" FFDB_BOOTSTRAP_TOKEN export FFDB_BOOTSTRAP_TOKEN node -e ' const response = await fetch(\"http://127.0.0.1:5173/v1/developer/bootstrap\", { method: \"POST\", headers: { \"content-type\": \"application/json\", \"x-ffdb-bootstrap-token\": process.env.FFDB_BOOTSTRAP_TOKEN, }, body: JSON.stringify({ email: process.env.FFDB_OWNER_EMAIL, password: process.env.FFDB_OWNER_PASSWORD, }), }); if (!response.ok) throw new Error(\"bootstrap failed: \" + response.status); console.log(\"owner created\"); ' unset FFDB_BOOTSTRAP_TOKEN"
        - complementary [ref=f1e139]:
          - text: "!"
          - strong [ref=f1e140]: One-time credential
          - paragraph [ref=f1e141]: Production requires a unique bootstrap token of at least 32 characters. Remove it from the operator workflow after the first owner is created and never expose it to browsers.
