      - heading "Quickstart" [level=1] [ref=f1e25]
      - paragraph [ref=f1e26]: Install a verified packaged release, bootstrap a project, and make one authenticated parameterized query.
      - generic [ref=f1e27]:
        - heading [level=2] [ref=f1e28]:
          - link "What, why, and when" [ref=f1e29] [cursor=pointer]:
            - /url: "#what-why-and-when"
            - text: What, why, and when#
        - paragraph [ref=f1e30]: Quickstart takes the packaged, zero-source single-host evaluation profile from reviewed installer to one authenticated application query.
        - paragraph [ref=f1e31]: It proves the complete product with digest-pinned PostgreSQL, MinIO, Mailpit, FFDB services, and gateway before you invest in production providers, schema, policies, uploads, or offline behavior.
        - paragraph [ref=f1e32]: Use it for a local evaluation, demo, or isolated clean host; single-host is not the internet-production topology, and contributors should use the separate source-development runbook.
      - generic [ref=f1e33]:
        - heading [level=2] [ref=f1e34]:
          - link "Prerequisites and required values" [ref=f1e35] [cursor=pointer]:
            - /url: "#prerequisites-and-required-values"
            - text: Prerequisites and required values#
        - list [ref=f1e36]:
          - listitem [ref=f1e37]: Prerequisite — A supported host with Docker Compose and curl, plus permission to create durable volumes.
          - listitem [ref=f1e38]: Prerequisite — Access to the official release channel or an operator-supplied verified bundle.
          - listitem [ref=f1e39]: Required value — Release installer URL, published checksum/signature material, and the explicit single-host profile selection.
          - listitem [ref=f1e40]: Required value — Loopback FFDB origin, owner email/password, root-only generated bootstrap token, organization slug, and project name.
      - generic [ref=f1e41]:
        - heading [level=2] [ref=f1e42]:
          - link "Install a zero-source evaluation host" [ref=f1e43] [cursor=pointer]:
            - /url: "#install-a-zero-source-evaluation-host"
            - text: Install a zero-source evaluation host#
        - paragraph [ref=f1e44]: The packaged single-host profile evaluates the complete product without a repository checkout, Rust compiler, Node toolchain, or hand-assembled dependency stack. After signature verification, one release starts digest-pinned PostgreSQL, MinIO, persistent Mailpit capture, the FFDB API and workers, and the unified gateway.
        - figure "Public single-host command (not published yet) sh Copy Public single-host command (not published yet) code" [ref=f1e45]:
