        - complementary [ref=f1e174]:
          - text: "!"
          - strong [ref=f1e175]: Credential separation
          - paragraph [ref=f1e176]: Platform login manages organizations and projects. Database administration uses a separate scoped project developer key. Do not ship either credential in a browser bundle.
