      - generic [ref=f1e193]:
        - heading [level=2] [ref=f1e194]:
          - link "Step by step" [ref=f1e195] [cursor=pointer]:
            - /url: "#step-by-step"
            - text: Step by step#
        - list [ref=f1e196]:
          - listitem [ref=f1e197]: 1. Download ffdb-install.sh to a file, inspect it, and run it with --profile single-host --start --require-signature.
          - listitem [ref=f1e198]: 2. Verify sudo ffdb-host status and the loopback gateway readiness endpoint before creating credentials.
          - listitem [ref=f1e199]: 3. Extract the generated bootstrap token into a root-only file without printing it, bootstrap the first platform owner once, then remove the token from routine use.
          - listitem [ref=f1e200]: 4. Create and link a project with the packaged CLI.
          - listitem [ref=f1e201]: 5. Install the client SDK package, sign in an end user, and run the sample query.
      - generic [ref=f1e202]:
        - heading [level=2] [ref=f1e203]:
          - link "Expected result" [ref=f1e204] [cursor=pointer]:
            - /url: "#expected-result"
            - text: Expected result#
        - paragraph [ref=f1e205]: The preserved-volume evaluation stack is ready on loopback, the project exists, an end-user session is stored, and the query returns only rows visible to that user.
      - generic [ref=f1e206]:
        - heading [level=2] [ref=f1e207]:
          - link "Failure modes and recovery" [ref=f1e208] [cursor=pointer]:
            - /url: "#failure-modes-and-recovery"
            - text: Failure modes and recovery#
        - list [ref=f1e209]:
          - listitem [ref=f1e210]: Checksum or signature verification fails — delete the artifact and stop; do not install it.
          - listitem [ref=f1e211]: Readiness fails — inspect packaged service status and logs before creating credentials.
          - listitem [ref=f1e212]: A single-host port is exposed beyond loopback — stop the stack and restore the packaged bindings; do not use this profile on the internet.
          - listitem [ref=f1e213]: The query returns unauthorized rows — stop the evaluation and treat it as a security incident.
