            - button "Copy Public single-host command (not published yet) code" [ref=f1e49] [cursor=pointer]:
              - generic [ref=f1e53]: Copy
            - status [ref=f1e54]
          - generic "Public single-host command (not published yet), sh code" [ref=f1e55]:
