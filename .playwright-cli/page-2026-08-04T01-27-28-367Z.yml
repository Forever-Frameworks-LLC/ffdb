        - heading [level=2] [ref=f1e118]:
          - link "What, why, and when" [ref=f1e119] [cursor=pointer]:
            - /url: "#what-why-and-when"
            - text: What, why, and when#
        - paragraph [ref=f1e120]: This documentation maps the released FFDB server, SDK packages, security boundaries, and operator workflows.
        - paragraph [ref=f1e121]: Starting here prevents a deployment choice, credential type, or local-replica design from being mistaken for a supported product guarantee.
        - paragraph [ref=f1e122]: Use it before installing FFDB or when deciding which guide owns the next task.
      - generic [ref=f1e123]:
        - heading [level=2] [ref=f1e124]:
          - link "Prerequisites and required values" [ref=f1e125] [cursor=pointer]:
            - /url: "#prerequisites-and-required-values"
            - text: Prerequisites and required values#
        - list [ref=f1e126]:
          - listitem [ref=f1e127]: Prerequisite — A workload that needs self-hosted auth, scoped SQL, storage, or offline sync.
          - listitem [ref=f1e128]: Prerequisite — An operator who can own PostgreSQL, S3-compatible storage, email, TLS, and backups.
          - listitem [ref=f1e129]: "Required value — The intended installation shape: packaged Docker release or packaged native components."
          - listitem [ref=f1e130]: "Required value — The application runtime: browser, React, React Native, Node, or direct HTTP."
      - generic [ref=f1e131]:
        - heading [level=2] [ref=f1e132]:
          - link "What FFDB is" [ref=f1e133] [cursor=pointer]:
            - /url: "#what-ffdb-is"
            - text: What FFDB is#
        - paragraph [ref=f1e134]: FFDB is a self-hostable data platform. PostgreSQL stores organizations, projects, credentials, jobs, and other control-plane state. Application rows live in a dedicated SQLite database for each project and are only reached through constrained workers.
        - paragraph [ref=f1e135]: The public surface includes authentication, parameterized SQL, PostgreSQL-style row-level policies, logical offline sync, RLS-protected S3-compatible storage, a TypeScript SDK, a CLI, and a management portal.
      - generic [ref=f1e136]:
        - heading [level=2] [ref=f1e137]:
          - link "Choose a path" [ref=f1e138] [cursor=pointer]:
            - /url: "#choose-a-path"
            - text: Choose a path#
        - list [ref=f1e139]:
          - listitem [ref=f1e140]: Install a verified release bundle, then use the portal and packaged CLI to create a project.
          - listitem [ref=f1e141]: Install the version-matched @ffdb/client SDK package in an existing browser or Node application.
          - listitem [ref=f1e142]: Add the @ffdb/react, @ffdb/react-native, or @ffdb/sync-client SDK package when the runtime needs that integration.
          - listitem [ref=f1e143]: Read the production security and backup guides before exposing a deployment to untrusted traffic.
        - complementary [ref=f1e144]:
          - text: i
          - strong [ref=f1e145]: Use matched releases
          - paragraph [ref=f1e146]: Applications never receive a raw SQLite connection or file. Install the signed server release and pin @ffdb/client, @ffdb/cli, and integration tarballs to the same version so the API and package contracts stay aligned.
      - generic [ref=f1e147]:
        - heading [level=2] [ref=f1e148]:
          - link "Step by step" [ref=f1e149] [cursor=pointer]:
            - /url: "#step-by-step"
            - text: Step by step#
        - list [ref=f1e150]:
          - listitem [ref=f1e151]: 1. Choose the packaged installation route and bring the service to ready.
          - listitem [ref=f1e152]: 2. Create an organization and project, then separate platform credentials from end-user sessions.
          - listitem [ref=f1e153]: 3. Add the matching SDK packages and issue one parameterized, RLS-scoped query.
          - listitem [ref=f1e154]: 4. Finish with backup, observability, and production-security checks.
