            - text: What, why, and when#
        - paragraph [ref=e121]: This documentation maps the released FFDB server, SDK packages, security boundaries, and operator workflows.
        - paragraph [ref=e122]: Starting here prevents a deployment choice, credential type, or local-replica design from being mistaken for a supported product guarantee.
        - paragraph [ref=e123]: Use it before installing FFDB or when deciding which guide owns the next task.
      - generic [ref=e124]:
        - heading [level=2] [ref=e125]:
          - link "Prerequisites and required values" [ref=e126] [cursor=pointer]:
            - /url: "#prerequisites-and-required-values"
            - text: Prerequisites and required values#
        - list [ref=e127]:
          - listitem [ref=e128]: Prerequisite — A workload that needs self-hosted auth, scoped SQL, storage, or offline sync.
          - listitem [ref=e129]: Prerequisite — An operator who can own PostgreSQL, S3-compatible storage, email, TLS, and backups.
          - listitem [ref=e130]: "Required value — The intended installation shape: packaged Docker release or packaged native components."
          - listitem [ref=e131]: "Required value — The application runtime: browser, React, React Native, Node, or direct HTTP."
      - generic [ref=e132]:
        - heading [level=2] [ref=e133]:
          - link "What FFDB is" [ref=e134] [cursor=pointer]:
            - /url: "#what-ffdb-is"
            - text: What FFDB is#
        - paragraph [ref=e135]: FFDB is a self-hostable data platform. PostgreSQL stores organizations, projects, credentials, jobs, and other control-plane state. Application rows live in a dedicated SQLite database for each project and are only reached through constrained workers.
        - paragraph [ref=e136]: The public surface includes authentication, parameterized SQL, PostgreSQL-style row-level policies, logical offline sync, RLS-protected S3-compatible storage, a TypeScript SDK, a CLI, and a management portal.
      - generic [ref=e137]:
        - heading [level=2] [ref=e138]:
          - link "Choose a path" [ref=e139] [cursor=pointer]:
            - /url: "#choose-a-path"
            - text: Choose a path#
        - list [ref=e140]:
          - listitem [ref=e141]: Install a verified release bundle, then use the portal and packaged CLI to create a project.
          - listitem [ref=e142]: Install the version-matched @ffdb/client SDK package in an existing browser or Node application.
          - listitem [ref=e143]: Add the @ffdb/react, @ffdb/react-native, or @ffdb/sync-client SDK package when the runtime needs that integration.
          - listitem [ref=e144]: Read the production security and backup guides before exposing a deployment to untrusted traffic.
        - complementary [ref=e145]:
          - text: i
          - strong [ref=e146]: Use matched releases
          - paragraph [ref=e147]: Applications never receive a raw SQLite connection or file. Install the signed server release and pin @ffdb/client, @ffdb/cli, and integration tarballs to the same version so the API and package contracts stay aligned.
      - generic [ref=e148]:
        - heading [level=2] [ref=e149]:
          - link "Step by step" [ref=e150] [cursor=pointer]:
            - /url: "#step-by-step"
            - text: Step by step#
        - list [ref=e151]:
          - listitem [ref=e152]: 1. Choose the packaged installation route and bring the service to ready.
          - listitem [ref=e153]: 2. Create an organization and project, then separate platform credentials from end-user sessions.
          - listitem [ref=e154]: 3. Add the matching SDK packages and issue one parameterized, RLS-scoped query.
          - listitem [ref=e155]: 4. Finish with backup, observability, and production-security checks.
