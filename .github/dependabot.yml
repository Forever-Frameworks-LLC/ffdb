version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
      rust-minor:
        applies-to: version-updates
        update-types: [minor, patch]
      rust-crypto-major:
        applies-to: version-updates
        patterns: [hmac, hkdf, sha2]
        update-types: [major]
      rust-sqlx-major:
        applies-to: version-updates
        patterns: [sqlx-core, sqlx-postgres]
        update-types: [major]
    # password-hash 0.6 uses a new trait/API generation. The current stable
    # argon2 release still implements password-hash 0.5, so upgrading only the
    # direct dependency creates two incompatible trait versions. Revisit this
    # when argon2 publishes a compatible stable release.
    ignore:
      - dependency-name: password-hash
        versions: ["0.6.x"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-test-major:
        applies-to: version-updates
        patterns: [jsdom, "@testing-library/jest-dom"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-versions:
        applies-to: version-updates
        patterns: ["*"]
