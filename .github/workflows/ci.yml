name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      compose: ${{ steps.filter.outputs.compose }}
      supply_chain: ${{ steps.filter.outputs.supply_chain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select the required CI suites
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${GITHUB_SHA}^")"
          fi

          rust=false
          typescript=false
          compose=false

          while IFS= read -r path; do
            recognized=false

            case "$path" in
              .github/workflows/*)
                rust=true
                typescript=true
                compose=true
                recognized=true
                ;;
              Cargo.toml|Cargo.lock|deny.toml|rust-toolchain.toml|apps/*/Cargo.toml|apps/*/src/*|crates/*|fuzz/*)
                rust=true
                recognized=true
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|apps/portal/*|apps/docs/*|apps/landing/*|packages/*)
                typescript=true
                recognized=true
                ;;
              Makefile|compose*.yaml|compose*.yml|docker-compose*.yaml|docker-compose*.yml|Dockerfile*|infra/*|scripts/*|config/*|release/*|install*)
                compose=true
                recognized=true
                ;;
              .github/dependabot.yml|.gitleaks.toml|.gitignore|LICENSE*|README*|SECURITY.md|docs/*)
                recognized=true
                ;;
            esac

            # New source/config paths must receive the full matrix until this
            # classifier explicitly assigns them to a narrower suite.
            if [[ "$recognized" == false ]]; then
              rust=true
              typescript=true
              compose=true
            fi
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")

          {
            echo "rust=$rust"
            echo "typescript=$typescript"
            echo "compose=$compose"
            if [[ "$rust" == true || "$typescript" == true ]]; then
              echo "supply_chain=true"
            else
              echo "supply_chain=false"
            fi
          } >> "$GITHUB_OUTPUT"

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive_path" \
            | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the release source tree for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks" dir "$GITHUB_WORKSPACE"
          --config "$GITHUB_WORKSPACE/.gitleaks.toml"
          --timeout 120
          --max-target-megabytes 10
          --max-decode-depth 1
          --redact
          --no-banner

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Bounded API load smoke
        run: cargo test -p ffdb-api --test load_smoke --locked

  rust-arm64:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets --locked

  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
      # The repository pins stable in rust-toolchain.toml, so each fuzz command
      # must select nightly explicitly instead of relying on the setup action's
      # temporary default-toolchain selection.
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Compile fuzz targets with their locked dependency graph
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Prepare writable fuzz corpora from reviewed seeds
        run: |
          mkdir -p fuzz/corpus/sql_parser fuzz/corpus/rls_bypass
          cp fuzz/seeds/sql_parser/*.sql fuzz/corpus/sql_parser/
          cp fuzz/seeds/rls_bypass/*.sql fuzz/corpus/rls_bypass/
      - name: Fuzz SQL parsing and classification
        run: >-
          cargo +nightly fuzz run --fuzz-dir fuzz sql_parser fuzz/corpus/sql_parser --
          -dict=${{ github.workspace }}/fuzz/sql.dict
          -max_total_time=30 -max_len=4096 -timeout=5
      - name: Fuzz the SQLite RLS execution boundary
        run: >-
          cargo +nightly fuzz run --fuzz-dir fuzz rls_bypass fuzz/corpus/rls_bypass --
          -dict=${{ github.workspace }}/fuzz/sql.dict
          -max_total_time=30 -max_len=2048 -timeout=5

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  supply-chain:
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: make production-config-check
      - run: make release-check
      - run: make native-install-linux-test
